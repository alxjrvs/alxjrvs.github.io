    .face { fill: #a986d6; } .pip { fill: #14161f; }
  </style>
  <rect class="face" width="32" height="32" rx="6"/>
  <g class="pip"><circle cx="23" cy="9" r="2.9"/><circle cx="9" cy="16" r="2.9"/><circle cx="23" cy="16" r="2.9"/><circle cx="16" cy="23" r="2.9"/></g>
</svg>
