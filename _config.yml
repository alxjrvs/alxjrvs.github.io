title: alxjrvs
tagline: Software engineer. I build small, sharp tools.
description: >-
  The personal site of alxjrvs — software engineer. Writing, work, and
  marginalia from a terminal.
author: alxjrvs
url: "https://alxjrvs.github.io"
baseurl: ""
lang: en
timezone: America/New_York

# ── build ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/

# Fully custom design — no theme. (github-pages bundles minima; we don't use it.)
theme:

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── navigation (rendered by _layouts/default.html) ─────
nav:
  - { name: index, url: / }
  - { name: work,  url: /work/ }
  - { name: about, url: /about/ }

# The "things i made" data now lives in _data/work.yml — grouped by
# org/topic, with a page per project at /work/<slug>/. Rendered on / and /work/.

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - mise.toml
  - vendor
  - .jekyll-cache
