title: alxjrvs
tagline: Software engineer. I build small, sharp tools.
description: >-
  The personal site of alxjrvs — software engineer. Projects first, plus
  the occasional piece of writing.
author: alxjrvs
url: "https://alxjrvs.github.io"
baseurl: ""
lang: en
timezone: America/New_York

# ── build ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/

# Fully custom design — no theme. (github-pages bundles minima; we don't use it.)
theme:

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from   # old /work/ URLs → /projects/

# ── navigation (rendered by _layouts/default.html) ─────
# Items with `needs_posts: true` only appear once _posts/ has something in it,
# so the writing link shows up on its own with the first post.
nav:
  - { name: index,    url: / }
  - { name: projects, url: /projects/ }
  - { name: writing,  url: /writing/, needs_posts: true }
  - { name: about,    url: /about/ }

# Projects live in _data/work.yml — grouped by org/topic, with a page per
# site at /projects/<slug>/. Rendered on / (flagships) and /projects/ (all).

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - mise.toml
  - vendor
  - .jekyll-cache
