name: Screenshots

# Re-captures each project's live site into assets/work/ and commits the result
# when anything changed. Runs on demand and every day at 3am US Eastern. On PRs that touch the
# project list or this tooling it only captures projects with no screenshot
# yet, committing those back to the PR branch.
on:
  workflow_dispatch:
  # GitHub cron is UTC-only, so both 07:00 and 08:00 UTC fire and the job
  # below only proceeds on the one that is 3am in New York (EDT vs EST).
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  pull_request:
    paths:
      - "_projects/**"
      - "scripts/screenshots.mjs"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write
  pull-requests: write # to open and merge the bot PR

concurrency:
  group: screenshots-${{ github.ref }}
  # Never cancel a scheduled run mid-landing (it could strand the bot branch).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    # A fork's PR gets a read-only token, so only same-repo branches commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Only run at 3am New York time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Match on the cron that fired, not the clock: scheduled runs can start late.
            offset=$(TZ=America/New_York date +%z)   # -0400 (EDT) or -0500 (EST)
            want="0 7 * * *"; [ "$offset" = "-0500" ] && want="0 8 * * *"
            if [ "${{ github.event.schedule }}" != "$want" ]; then
              echo "Not 3am in New York for this cron; skipping."
              echo "skip=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # A personal token (when set) makes the bot's pushes and PRs trigger
          # CI like anyone else's; the default Actions token can't.
          token: ${{ github.event_name != 'pull_request' && secrets.SCREENSHOTS_TOKEN || github.token }}

      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - if: steps.gate.outputs.skip != '1'
        name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.48.2 sharp@0.33
          npx playwright install --with-deps chromium

      - if: steps.gate.outputs.skip != '1'
        name: Capture
        run: node scripts/screenshots.mjs
        env:
          # On PRs, only capture projects that have no screenshot yet (see the script).
          ONLY_MISSING: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - if: steps.gate.outputs.skip != '1'
        name: Commit changed screenshots
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOTS_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.SCREENSHOTS_TOKEN != '' }}
        run: |
          git add -A assets/work
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh project screenshots"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push
            exit 0
          fi

          # main only takes a commit through a PR whose own CI passed. With
          # SCREENSHOTS_TOKEN the bot PR gets normal CI and is merged once
          # green; without it the PR is left open for a person to merge.
          base="${{ github.ref_name }}"
          branch="bot/screenshots-${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$base" --head "$branch" --title "Refresh project screenshots" \
            --body "Re-capture of each project's live site (run ${{ github.run_id }})."
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "No SCREENSHOTS_TOKEN secret, so leaving the PR open to merge by hand."
            exit 0
          fi
          trap 'gh pr close "$branch" --delete-branch || true' ERR
          sleep 15 # let the PR's CI register before watching it
          gh pr checks "$branch" --watch --required --interval 15
          for i in $(seq 1 12); do
            gh pr merge "$branch" --squash --delete-branch && exit 0
            sleep 10
          done
          false
