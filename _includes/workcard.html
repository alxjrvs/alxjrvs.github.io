{%- comment -%} One project card. Pass `slug=` — looks the site up in _data/work.yml. {%- endcomment -%}
{%- assign s = site.data.work.sites[include.slug] -%}
<li class="workcard">
  <a class="workcard-link" href="{{ '/projects/' | append: include.slug | append: '/' | relative_url }}">
    {%- if s.shot -%}
    <span class="workcard-thumb">
      <img src="{{ '/assets/work/' | append: s.shot | relative_url }}" alt="{{ s.name }} — screenshot" loading="lazy" width="1280" height="800">
    </span>
    {%- else -%}
    <span class="workcard-thumb workcard-thumb--none" aria-hidden="true"><span class="sq"></span></span>
    {%- endif -%}
    <span class="workcard-body">
      <span class="workcard-name">{{ s.name }}</span>
      <span class="workcard-blurb">{{ s.blurb }}</span>
    </span>
  </a>
</li>
