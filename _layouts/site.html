---
layout: default
---
{%- assign s = site.data.work.sites[page.slug] -%}
<header class="pagehead">
  <p class="eyebrow"><a class="backlink" href="{{ '/work/' | relative_url }}">← things i made</a></p>
  <h1>{{ s.name }}</h1>
</header>

<p class="lede">{{ s.blurb }}</p>

<div class="site-actions">
  <a class="btn btn--primary" href="{{ s.url }}">Visit {{ s.name }} <span aria-hidden="true">↗</span></a>
  {%- if s.code and s.code != s.url -%}
  <a class="btn" href="{{ s.code }}">View the code <span aria-hidden="true">↗</span></a>
  {%- endif -%}
</div>

{%- if s.shot -%}
<a class="site-shot" href="{{ s.url }}" aria-label="Visit {{ s.name }}">
  <img src="{{ '/assets/work/' | append: s.shot | relative_url }}" alt="{{ s.name }} — screenshot" width="1280" height="800">
</a>
{%- endif -%}
