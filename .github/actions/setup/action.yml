name: Set up
description: Install the pinned Bun (.bun-version) and the locked dependencies. Requires actions/checkout to have run.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
