# ─────────────────────────────────────────────────────────────
# The "things i made" data model.
#
# SITES are the main event — each is a first-class entry with its
# own page at /work/<slug>/ (rendered by _layouts/site.html), even
# when several share one `code` repo.
#
# `groups` only organize the /work/ index into sections by
# org/topic; each group's `flagship` is the site shown on the
# landing page. Screenshots live in assets/work/.
# ─────────────────────────────────────────────────────────────

groups:
  - name: Salvage Union
    blurb: A tabletop RPG toolkit — the SRD as a fast reference, plus the API, bot, and apps around it.
    flagship: salvageunion-io
    sites: [salvageunion-io, intheunionnow, salvage-union-api, salvage-union-discord]

  - name: RANDSUM
    blurb: Dice as a properly-typed library — plus the playground, spec, and bot built on the notation.
    flagship: randsum-dev
    sites: [randsum-dev, randsum-io, notation-randsum-dev, randsum-discord]

  - name: Tools
    blurb: Small, sharp things I build for myself.
    flagship: boom
    sites: [boom, vellum, dotfiles]

sites:
  # ── Salvage Union ─────────────────────────────────────────
  salvageunion-io:
    name: SalvageUnion.io
    blurb: The full Salvage Union SRD as a fast, searchable reference, with a pilot & mech builder.
    url: https://salvageunion.io
    code: https://github.com/alxjrvs/salvageunion-reference
    shot: salvageunion-io.png

  intheunionnow:
    name: InTheUnionNow
    blurb: A local-first Salvage Union character manager — your pilots and mechs, saved right in your browser.
    url: https://intheunionnow.com
    code: https://github.com/alxjrvs/salvageunion-reference
    shot: intheunionnow.png

  salvage-union-api:
    name: The Salvage Union API
    blurb: The SRD as structured JSON — the data layer every other Salvage Union tool reads from.
    url: https://salvageunion.io/api/
    code: https://github.com/alxjrvs/salvageunion-reference
    shot: salvageunion-api.png

  salvage-union-discord:
    name: The Salvage Union Discord Bot
    blurb: Roll and reference the SRD without leaving your table's Discord server.
    url: https://salvageunion.io/discord/
    code: https://github.com/alxjrvs/salvageunion-reference
    shot:

  # ── RANDSUM ───────────────────────────────────────────────
  randsum-dev:
    name: randsum.dev
    blurb: The library's home — a zero-dependency, TypeScript-first, Bun-native rolling engine (@randsum/roller).
    url: https://randsum.dev
    code: https://github.com/RANDSUM/randsum
    shot: randsum-dev.png

  randsum-io:
    name: randsum.io
    blurb: The dice-notation playground — type any RANDSUM notation and roll it live, with the full modifier cheatsheet.
    url: https://randsum.io
    code: https://github.com/RANDSUM/randsum
    shot: randsum-io.png

  notation-randsum-dev:
    name: notation.randsum.dev
    blurb: RANDSUM Dice Notation (RDN) — the formal specification for the notation the whole library speaks.
    url: https://notation.randsum.dev
    code: https://github.com/RANDSUM/randsum
    shot: notation-randsum-dev.png

  randsum-discord:
    name: The RANDSUM Discord Bot
    blurb: Roll RANDSUM notation straight from Discord.
    url: https://randsum.dev/discord
    code: https://github.com/RANDSUM/randsum
    shot:

  # ── Tools ─────────────────────────────────────────────────
  boom:
    name: boom
    blurb: A declarative engine that provisions your machine and code workspaces from one config.
    url: https://github.com/alxjrvs/boom
    code: https://github.com/alxjrvs/boom
    shot: boom-github.png

  vellum:
    name: vellum
    blurb: A quiet, local-first home for your Daggerheart character — on stream or at the table.
    url: https://github.com/alxjrvs/vellum
    code: https://github.com/alxjrvs/vellum
    shot: vellum-github.png

  dotfiles:
    name: dotFiles
    blurb: This machine's config — small, exemplary, boom's first consumer.
    url: https://github.com/alxjrvs/dotFiles
    code: https://github.com/alxjrvs/dotFiles
    shot: dotfiles-github.png
