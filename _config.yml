title: alxjrvs
tagline: Software engineer. I build small, sharp tools.
description: >-
  The personal site of alxjrvs — software engineer. Writing, work, and
  marginalia from a terminal.
author: alxjrvs
url: "https://alxjrvs.github.io"
baseurl: ""
lang: en
timezone: America/New_York

# ── build ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/

# Fully custom design — no theme. (github-pages bundles minima; we don't use it.)
theme:

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── navigation (rendered by _layouts/default.html) ─────
nav:
  - { name: index, url: / }
  - { name: work,  url: /work/ }
  - { name: about, url: /about/ }

# ── the "things i made" list (rendered on / and /work/) ─
projects:
  - name: boom
    blurb: A declarative engine that provisions your machine and code workspaces from one config.
    url: https://github.com/alxjrvs/boom
  - name: SUSRD
    blurb: The Salvage Union rules, as a fast reference and character/mech builder.
    url: https://salvageunion.io
  - name: RANDSUM
    blurb: Dice, as a properly-typed library. Roll anything, notation-first.
    url: https://github.com/RANDSUM/randsum
  - name: vellum
    blurb: A quiet, local-first home for your Daggerheart character — on stream or at the table.
    url: https://github.com/alxjrvs/vellum
  - name: dotFiles
    blurb: This machine's config — small, exemplary, boom's first consumer.
    url: https://github.com/alxjrvs/dotFiles

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - mise.toml
  - vendor
  - .jekyll-cache
