title: alxjrvs
tagline: Enthusiast. I make stuff.
description: Alex Jarvis makes stuff.
author: alxjrvs
url: "https://alxjrvs.com"
baseurl: ""
lang: en
timezone: America/New_York

# ── build ──────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/

# Fully custom design, no theme. (github-pages bundles minima; we don't use it.)
theme:

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from   # old /work/ URLs land somewhere useful

# ── projects ───────────────────────────────────────────
# One front-matter-only file per project in _projects/, sorted by `order`.
# They render as cards on the home page; there are no per-project pages.
collections:
  projects:
    output: false

defaults:
  # The social preview card (Open Graph / Twitter) for every page. Made from
  # scripts/social-card.html by scripts/social-card.mjs; re-render it when
  # the palette, wordmark or tagline change. A page can set its own `image:`.
  - scope: { path: "" }
    values:
      image:
        path: /assets/social.png
        width: 1200
        height: 630
        alt: "alxjrvs, over a field of dice: Enthusiast. I make stuff."
  - scope: { type: posts }
    values: { layout: post }

# ── navigation (rendered by _layouts/default.html) ─────
# Each item scrolls to a section of the home page. Items with
# `needs_posts: true` only appear once _posts/ has something in it, so the
# writing link shows up on its own with the first post.
nav:
  - { name: Projects, url: "/#projects" }
  - { name: Writing,  url: "/#writing", needs_posts: true }
  - { name: About,    url: "/#about" }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN.md
  - mise.toml
  - scripts
  - node_modules
  - package-lock.json
  - vendor
  - .jekyll-cache
