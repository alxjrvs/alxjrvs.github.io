name: CI

# The gate: format, lint and typecheck, then build the site and check every
# internal link in the output. Runs on PRs and on pushes to main (a post-merge
# canary). Deploying is deploy.yml's job. The Screenshots workflow dispatches
# it on its bot branch, because main requires a green "build" check on a
# commit before it can be pushed there.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. PR runs are superseded by the next push; main runs are not
# cancelled, so every commit on main keeps a real verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Check links
        run: bun run check:links
